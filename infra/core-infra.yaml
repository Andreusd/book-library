AWSTemplateFormatVersion: '2010-09-09'
Description: 'Digital Book Library - Core Infrastructure (S3, DynamoDB, Cognito, CloudFront)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AllowedEmails:
    Type: String
    Description: Comma-separated list of authorized emails (Whitelist)
    Default: "andreusdantas@gmail.com"

  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID
    NoEcho: true

  GoogleClientSecret:
    Type: String
    Description: Google OAuth Client Secret
    NoEcho: true

Resources:
  # ==========================================
  # 1. STORAGE (S3 Buckets)
  # ==========================================
  BooksBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'book-library-storage-${AWS::AccountId}-${AWS::Region}-${Environment}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ['*']
            ExposedHeaders: ['ETag', 'Content-Range', 'Accept-Ranges']
            MaxAge: 3600

  WebHostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'book-library-web-${AWS::AccountId}-${AWS::Region}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ==========================================
  # 2. DATABASE (DynamoDB Single-Table)
  # ==========================================
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'BookLibrary-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1_PK
          AttributeType: S
        - AttributeName: GSI1_SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1_PK
              KeyType: HASH
            - AttributeName: GSI1_SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ==========================================
  # 3. AUTHENTICATION (Cognito + Google Identity)
  # ==========================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'BookLibraryUsers-${Environment}'
      AutoVerifiedAttributes:
        - email

  CognitoGoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "email profile openid"
      AttributeMapping:
        email: email
        name: name

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoGoogleProvider
    Properties:
      ClientName: !Sub 'BookLibraryWebClient-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      SupportedIdentityProviders:
        - Google
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://localhost:5173
      LogoutURLs:
        - https://localhost:5173

Outputs:
  BooksBucketName:
    Description: Name of the S3 storage bucket for books and covers
    Value: !Ref BooksBucket
    Export:
      Name: !Sub '${AWS::StackName}-BooksBucketName'

  BooksBucketArn:
    Description: ARN of the S3 storage bucket
    Value: !GetAtt BooksBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BooksBucketArn'

  WebHostingBucketName:
    Description: Name of the S3 web hosting bucket
    Value: !Ref WebHostingBucket
    Export:
      Name: !Sub '${AWS::StackName}-WebHostingBucketName'

  DynamoDBTableName:
    Description: Name of the DynamoDB Single-Table
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTableName'

  DynamoDBTableArn:
    Description: ARN of the DynamoDB Single-Table
    Value: !GetAtt DynamoDBTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTableArn'

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${AWS::StackName}-CognitoUserPoolId'

  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CognitoUserPoolArn'

  CognitoClientId:
    Description: Cognito Web Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-CognitoClientId'
