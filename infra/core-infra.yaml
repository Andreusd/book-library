AWSTemplateFormatVersion: '2010-09-09'
Description: 'Uzi Library - Core Infrastructure (S3, DynamoDB, Cognito, CloudFront)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AllowedEmails:
    Type: String
    Description: Comma-separated list of authorized emails (Whitelist)
    Default: "andreuzielsd@gmail.com"

  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID (Leave blank to configure later)
    Default: ""

  GoogleClientSecret:
    Type: String
    Description: Google OAuth Client Secret (Leave blank to configure later)
    NoEcho: true
    Default: ""

Conditions:
  HasGoogleOAuth: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]

Resources:
  # ==========================================
  # 1. STORAGE (S3 Buckets)
  # ==========================================
  BooksBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'uzi-library-storage-${AWS::AccountId}-${AWS::Region}-${Environment}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ['*']
            ExposedHeaders: ['ETag', 'Content-Range', 'Accept-Ranges']
            MaxAge: 3600

  WebHostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'uzi-library-web-${AWS::AccountId}-${AWS::Region}-${Environment}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'uzi-library-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub 'Uzi Library Web App (${Environment})'
        Origins:
          - Id: S3WebHostingOrigin
            DomainName: !GetAtt WebHostingBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiGatewayOrigin
            DomainName: 22837k6yyc.execute-api.us-east-1.amazonaws.com
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3WebHostingOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - X-User
                - Content-Type
                - Accept
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  WebHostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebHostingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebHostingBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'


  # ==========================================
  # 2. DATABASE (DynamoDB Single-Table)
  # ==========================================
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'UziLibrary-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1_PK
          AttributeType: S
        - AttributeName: GSI1_SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1_PK
              KeyType: HASH
            - AttributeName: GSI1_SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ==========================================
  # 3. AUTHENTICATION (Cognito + Google Identity)
  # ==========================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'UziLibraryUsers-${Environment}'
      AutoVerifiedAttributes:
        - email

  CognitoGoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleOAuth
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "email profile openid"
      AttributeMapping:
        email: email
        name: name

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'uzi-library-auth-${AWS::AccountId}-${Environment}'
      UserPoolId: !Ref CognitoUserPool

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoGoogleProvider
    Properties:
      ClientName: !Sub 'UziLibraryWebClient-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      SupportedIdentityProviders: !If
        - HasGoogleOAuth
        - [COGNITO, Google]
        - [COGNITO]
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://d4n8d1cbh8pro.cloudfront.net
        - https://localhost:5173
      LogoutURLs:
        - https://d4n8d1cbh8pro.cloudfront.net
        - https://localhost:5173


Outputs:
  BooksBucketName:
    Description: Name of the S3 storage bucket for books and covers
    Value: !Ref BooksBucket
    Export:
      Name: !Sub '${AWS::StackName}-BooksBucketName'

  BooksBucketArn:
    Description: ARN of the S3 storage bucket
    Value: !GetAtt BooksBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BooksBucketArn'

  WebHostingBucketName:
    Description: Name of the S3 web hosting bucket
    Value: !Ref WebHostingBucket
    Export:
      Name: !Sub '${AWS::StackName}-WebHostingBucketName'

  CloudFrontDomainName:
    Description: Public HTTPS domain URL for Uzi Library Web App
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomainName'


  DynamoDBTableName:
    Description: Name of the DynamoDB Single-Table
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTableName'

  DynamoDBTableArn:
    Description: ARN of the DynamoDB Single-Table
    Value: !GetAtt DynamoDBTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTableArn'

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${AWS::StackName}-CognitoUserPoolId'

  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CognitoUserPoolArn'

  CognitoClientId:
    Description: Cognito Web Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-CognitoClientId'
