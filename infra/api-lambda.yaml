AWSTemplateFormatVersion: '2010-09-09'
Description: 'Digital Book Library - Serverless FastAPI & Lambda Functions'

Parameters:
  CoreStackName:
    Type: String
    Default: book-library-core-dev

  DeployBucket:
    Type: String
    Default: book-library-storage-109990058921-us-east-1-dev

  DeployKey:
    Type: String
    Default: deploy/lambda-graviton.zip

Resources:

  # ==========================================
  # 1. IAM EXECUTION ROLE FOR LAMBDAS
  # ==========================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${CoreStackName}-LambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource:
                  - Fn::ImportValue: !Sub '${CoreStackName}-DynamoDBTableArn'
                  - !Sub
                    - '${TableArn}/index/*'
                    - TableArn:
                        Fn::ImportValue: !Sub '${CoreStackName}-DynamoDBTableArn'
        - PolicyName: S3StorageAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - Fn::ImportValue: !Sub '${CoreStackName}-BooksBucketArn'
                  - !Sub
                    - '${BucketArn}/*'
                    - BucketArn:
                        Fn::ImportValue: !Sub '${CoreStackName}-BooksBucketArn'

  # ==========================================
  # 2. FASTAPI LAMBDA FUNCTION
  # ==========================================
  FastApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${CoreStackName}-Api'
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: server.aws.lambda_app.handler

      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 512
      Timeout: 30
      Code:
        S3Bucket: !Ref DeployBucket
        S3Key: !Ref DeployKey
      Environment:
        Variables:
          DYNAMODB_TABLE:
            Fn::ImportValue: !Sub '${CoreStackName}-DynamoDBTableName'
          BOOKS_BUCKET:
            Fn::ImportValue: !Sub '${CoreStackName}-BooksBucketName'

  # ==========================================
  # 3. HTTP API GATEWAY (v2)
  # ==========================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${CoreStackName}-HttpApi'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - '*'
        AllowHeaders:
          - '*'

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FastApiFunction.Arn
      PayloadFormatVersion: '2.0'

  HttpApiProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/{proxy+}'
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  LambdaPermissionHttpApi:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FastApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

Outputs:
  ApiUrl:
    Description: HTTP API Gateway URL
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
